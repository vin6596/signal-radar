name: Refresh opportunity data

on:
  schedule:
    # Runs at 06:00 and 18:00 UTC (07:00 & 19:00 WAT) — twice a day.
    # Edit the cron expression to change frequency (min quota: every 5 min,
    # but GitHub throttles very frequent free schedules, so 2-4x/day is realistic).
    - cron: "0 6,18 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated data
        run: |
          git config user.name "signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          git diff --quiet --cached || git commit -m "Refresh opportunity data [skip ci]"
          git push
